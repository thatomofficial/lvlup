services:
  postgres:
    image: postgres:17-alpine
    container_name: lvlup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lvlup
      POSTGRES_PASSWORD: lvlup_dev
      POSTGRES_DB: lvlup
    ports:
      - "5432:5432"
    volumes:
      - lvlup-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lvlup -d lvlup"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lvlup-pgdata:
