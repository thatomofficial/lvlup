<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="chevron" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background; the splash screen backgroundColor supplies the navy. -->
  <polygon points="512,182 797.8,347 797.8,677 512,842 226.2,677 226.2,347"
           fill="none" stroke="url(#frame)" stroke-width="24"
           stroke-linejoin="round" filter="url(#glow)"/>
  <polygon points="512,220 764.9,366 764.9,658 512,804 259.1,658 259.1,366"
           fill="none" stroke="url(#frame)" stroke-width="5"
           stroke-linejoin="round" opacity="0.35"/>
  <path d="M 362 560 L 512 410 L 662 560"
        fill="none" stroke="url(#chevron)" stroke-width="54"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M 362 700 L 512 550 L 662 700"
        fill="none" stroke="url(#chevron)" stroke-width="54"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.55"/>
</svg>
